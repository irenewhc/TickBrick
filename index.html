<body>

    <div class="container">
        <h1>行程樂高</h1>
        <p class="subtitle">2026/10/29 ~ 11/6 北海道</p>

        <div class="toolbar">
            <div>
                <button onclick="addRow()">＋ 新增行程</button>
                <button onclick="saveData()" style="background: #c7c5c7; margin-left: 10px;">儲存</button>
            </div>
            <button onclick="exportCSV()" style="background: #4c56e1;">匯出 CSV</button>
        </div>

        <table id="itineraryTable">
            <thead>
                <tr>
                    <th>排序</th>
                    <th>日期</th>
                    <th>開始時間</th>
                    <th>結束時間</th>
                    <th>總時長</th>
                    <th>類別</th>
                    <th>行程內容</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 燈箱 Modal -->
    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalTitle">提示訊息</h3>
            <p id="modalDesc" style="color: #666; font-size: 14px; line-height: 1.5;"></p>
            <div class="modal-buttons" id="modalButtonsContainer"></div>
        </div>
    </div>

    <div id="toast">提示訊息</div>

    <script src="script.js" defer></script>

</body>

</html>
